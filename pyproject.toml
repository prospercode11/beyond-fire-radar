[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-fire-radar-api"
version = "0.1.0"
description = "Foundation API for Beyond Fire Radar"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
]
quality = [
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
storage = [
  "boto3>=1.35,<2",
]
property-data = [
  "pyshp>=2.3,<3",
  "pyproj>=3.6,<4",
]
redis = [
  "redis>=5,<6",
]
security = [
  "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["apps/api/app", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.9"
strict = false
warn_unused_ignores = true
exclude = "^apps/api/migrations/"
