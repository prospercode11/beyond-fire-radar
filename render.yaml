services:
  - type: web
    name: beyond-fire-radar-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    releaseCommand: python -m alembic -c apps/api/alembic.ini upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: ENABLE_BOOTSTRAP
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: ENABLE_LIVE_SARASOTA_DISPATCH_POLLING
        value: "false"
      - key: ENABLE_LEARNED_MODEL_SERVING
        value: "false"
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: REDIS_REQUIRED_FOR_READINESS
        value: "true"
      - key: RAW_SNAPSHOT_BACKEND
        value: s3
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: beyond-fire-radar-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
