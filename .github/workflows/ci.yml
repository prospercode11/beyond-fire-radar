name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,quality,postgres]'
      - run: npm --prefix apps/web ci
      - run: ./scripts/verify.sh
      - run: python scripts/dev.py migrate
      - run: python -m uvicorn app.main:app --app-dir apps/api --host 127.0.0.1 --port 8000 &
      - run: python scripts/api_smoke.py
